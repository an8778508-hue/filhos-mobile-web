          style: normal
        - asset: assets/fonts/gotham/Gotham-XLightItalic.otf
          weight: 200
          style: italic

        - asset: assets/fonts/gotham/GothamLight.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/gotham/GothamLightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/gotham/GothamBook.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/gotham/GothamBookItalic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/gotham/GothamMedium.otf
          weight: 500
          style: normal
        - asset: assets/fonts/gotham/GothamMediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/gotham/GothamBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/gotham/GothamBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/gotham/GothamBold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/gotham/GothamBoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/gotham/Gotham-UltraItalic.otf
          weight: 800
          style: normal
        - asset: assets/fonts/gotham/Gotham-UltraItalic.otf
          weight: 800
          style: italic

        - asset: assets/fonts/gotham/Gotham-Black.otf
          weight: 900
          style: normal
        - asset: assets/fonts/gotham/Gotham-Black.otf
          weight: 900
          style: italic
    - family: Ping
      fonts:
        - asset: assets/fonts/ping/PingAR+LT-Thin.otf
          weight: 100
          style: normal
        - asset: assets/fonts/ping/PingAR+LT-ExtraLight.otf
